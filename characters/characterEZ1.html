<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>',
			);
	</script>
	<title>獣爾騎兵 -「子刻ハッカ」</title>
	<meta
		name="description"
		content="「獣爾騎兵」は、ラジアン(柏木主税)による一次創作作品です。十二支をベースにした獣人型改造人間「獣爾騎兵」の1番手・子刻ハッカの紹介ページ。" />
</head>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-page-comp>
			<template #title>子刻ハッカ</template>
			<template #reading>ねのこくハッカ</template>
			<template #formalname>易.爾姫（ヰ.アルヂ）</template>

			丸い耳と糸状の尻尾が特徴的な獣爾騎兵の1番手こと兵長。<br />
			龍天国の指定難病である『山月病』の対策方法について数々の研究を展開している認定博士の少女。<br />
			獣爾騎兵の研究基地外から全く外を出歩かないため、生存と勝利のために時に献身的で時に好戦的で狂気ともいえる噂が出回っており、よく知らない人間から「生きるモルモット」と評されている。<br />
			17歳を自称しているが、戸籍情報などを調べても彼女に該当する“17歳の少女”は“当の昔から存在していない”らしく……

			<template #beast>子（ねずみ）</template>
			<template #riderno>1番手（兵長）</template>
			<template #gender>女性</template>
			<template #conceptage>17（自称）</template>
			<template #height>129cm</template>
			<template #weight>32kg</template>
			<template #birthday>12月1日（「易.爾姫」の戸籍上の誕生日）</template>
			<template #belonging>獣爾騎兵</template>
			<template #beastspecname>子機分身</template>
			<template #beastspecabout>クローン個体と意識を共有することで疑似的に分身出来る</template>
			<template #characteristic>ドＳでドＭなモルモット？／生き残りのためなら手段を問わない</template>
			<template #hobby>投薬実験</template>
			<template #skill>自分で自分の身体を手術すること</template>
			<template #favors>生存本能</template>
			<template #unlikes>モラトリアム人間</template>
			<template #characterimage>
				<img alt="子刻ハッカ" src="/img/cnsp/cnsp_imgEZ1.png" class="character-img" />
			</template>
		</character-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>
