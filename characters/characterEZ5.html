<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>',
			);
	</script>
	<title>獣爾騎兵 -「辰刻リウロン」</title>
	<meta
		name="description"
		content="「獣爾騎兵」は、ラジアン(柏木主税)による一次創作作品です。十二支をベースにした獣人型改造人間「獣爾騎兵」の5番手・辰刻リウロンの紹介ページ。" />
</head>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-page-comp>
			<template #title>辰刻リウロン</template>
			<template #reading>たつのこくリウロン</template>
			<template #formalname>劉.元画（リウ.ユァンファ）</template>

			龍の角と翼・尻尾が特徴的な獣爾騎兵の5番手。<br />
			空中戦や立ち回りに長けた機動力を持ち、獣爾騎兵では遊撃手として戦闘力の主力を握っている。<br />
			冷酷で不愛想な印象とは打って変わり、内面的にはとても温厚で闘いを好まない様子が窺われている。<br />
			ただそれは、一度決めた闘いで容赦も手加減もできない体質であるためらしく……

			<template #beast>辰（りゅう）</template>
			<template #riderno>5番手</template>
			<template #gender>男性</template>
			<template #conceptage>37</template>
			<template #height>170cm</template>
			<template #weight>62kg</template>
			<template #birthday>4月28日</template>
			<template #belonging>獣爾騎兵</template>
			<template #beastspecname>画竜点睛（空中走行）</template>
			<template #beastspecabout>空中を走行するように移動することで機動力の高い戦闘を繰り広げる</template>
			<template #characteristic>無口で冷静だが根は温厚なコワモテ／力加減ができない</template>
			<template #hobby>将棋</template>
			<template #skill>リバーシの完封勝ち</template>
			<template #favors>茶道</template>
			<template #unlikes>覚悟の無いまま自分に挑む相手</template>
			<template #characterimage>
				<img alt="辰刻リウロン" src="/img/art/art_imgEZ5.png" class="character-img" />
			</template>
		</character-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>
